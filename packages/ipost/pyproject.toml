[project]
name = "ipost"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28",
    "pydantic>=2.11",
    "pydantic-settings>=2.10",
    "pillow>=11.0",
    "supabase>=2.15",
    "openai-agents[litellm]>=0.21.1",
    "python-dotenv>=1.2.3",
    "tenacity>=9.1.4",
    "boto3>=1.43.73",
    "psycopg[binary]>=3.3.4",
]

[project.scripts]
ipost-test-simple = "ipost.agents.test_simple:main"
ipost-test-full = "ipost.agents.test_full:main"
ipost-create-admin = "ipost.create_admin:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ipost"]

[tool.hatch.build.targets.wheel.force-include]
"ipost/assets/logo.png" = "ipost/assets/logo.png"
