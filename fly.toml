app = "ipost"
primary_region = "gru"

[build]
  dockerfile = "apps/api/Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[http_service.http_options]
  idle_timeout = 600

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
